name: Keiba Auto Discord

on:
  schedule:
    # 予想送信: 15分おき（JST 土日月 9:00〜16:45 = UTC 0:00〜7:45）
    #   月曜は祝日開催用。開催がない日は数十秒で終了する
    - cron: "0,15,30,45 0-7 * * 6,0,1"
    # 週次: データ更新+成績サマリー（JST 月曜22:00 = UTC 月曜13:00）
    - cron: "0 13 * * 1"
    # 月次: モデル再訓練+勝率較正（JST 2日 3:00 = UTC 1日 18:00）
    - cron: "0 18 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        type: choice
        options:
          - predict
          - weekly
          - retrain
        default: predict

concurrency:
  group: keiba-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  predict:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0,15,30,45 0-7 * * 6,0,1') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'predict')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: pip install -r src/requirements.txt

      - name: Check and send predictions
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AHEAD_MINUTES: "15"
          CHECK_INTERVAL: "15"
          PYTHONIOENCODING: "utf-8"
        run: python src/check_and_send.py

      - name: Commit bet log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bet_log.csv
          if git diff --cached --quiet; then
            echo "No new recommendations."
            exit 0
          fi
          git commit -m "log: bet recommendations"
          git pull --rebase origin main
          git push origin main

  weekly:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 13 * * 1') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'weekly')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: pip install -r src/requirements.txt

      - name: Update race data
        env:
          PYTHONIOENCODING: "utf-8"
        run: python src/update_data.py

      - name: Send results summary to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONIOENCODING: "utf-8"
        run: python src/check_results.py --discord

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/races.csv data/horse_stats.csv data/update_log.txt
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: weekly race results update"
          git pull --rebase origin main
          git push origin main

  retrain:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '0 18 1 * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'retrain')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/requirements.txt

      - name: Install dependencies
        run: pip install -r src/requirements.txt

      - name: Retrain model
        env:
          PYTHONIOENCODING: "utf-8"
        run: python src/train_model.py

      - name: Calibrate win probability
        env:
          PYTHONIOENCODING: "utf-8"
        run: python src/calibrate_temperature.py

      - name: Commit model files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/model.pkl data/stats.pkl data/calibration.json
          if git diff --cached --quiet; then
            echo "No model changes."
            exit 0
          fi
          git commit -m "model: monthly retrain + calibration"
          git pull --rebase origin main
          git push origin main
