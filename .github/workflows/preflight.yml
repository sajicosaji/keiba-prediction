name: Keiba Preflight (出す前の点検)
# 2026-11-02 ユーザーの指摘「検証をしてから納品してくれ」。本番と同じ環境で各係を「送らない試し走り」で動かし、
# 壊れていたら Discord に知らせる(問題なければ何も送らない)。コードを変えた時と、毎週末のレース前に動く。
on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**', '.github/workflows/**']
  schedule:
    - cron: '0 12 * * 5'    # 金曜 21:00 JST(週末の前)
    - cron: '0 22 * * 5,6'  # 土・日 7:00 JST(day runner の前)
  workflow_dispatch:
concurrency:
  group: preflight
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/requirements.txt
      - name: Install dependencies
        run: pip install -r src/requirements.txt
      - name: Preflight
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONIOENCODING: "utf-8"
        run: python tools/preflight.py
