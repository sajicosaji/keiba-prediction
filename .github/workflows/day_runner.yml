name: Keiba Day Runner

# 1日当番ジョブ。土日月の朝に自動起動し、レース終了までクラウド上で
# 予測送信を続け、最後に当日精算まで実行して終了する。PCは一切不要。
# GitHubの15分おきcron(keiba.yml)が昼にスキップされても、この当番が全日カバーする。
#
# 時刻はUTC基準。JST 9:00-16:50のレース = UTC 0:00-7:50。
#   morning:   起動〜UTC 04:00(JST 13:00) を13分おきに予測
#   afternoon: UTC 04:00〜07:55(JST 16:55) を予測、UTC 08:47(JST 17:47)に精算

on:
  workflow_dispatch:
  schedule:
    # 土日月の朝 JST 9:02〜9:47 に複数回、自動起動を試みる（GitHubのcron遅延・間引き対策の多重保険）
    # ※UTC 00:00以降でないとmorningループがUTC05:00を過去計算して即終了するため、00:02以降に配置
    - cron: "2,12,22,32,47 0 * * 6,0,1"

concurrency:
  # 当番ジョブ専用グループ。2回目の起動が1回目をキャンセルして最新に集約。
  # 予測cron(keiba-bot)とは別グループなので互いに干渉しない。
  group: keiba-dayrunner
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  morning:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Notify monitoring start (once/day)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          today=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          mark=data/heartbeat_log.csv
          if [ -f "$mark" ] && grep -q "^$today" "$mark"; then
            echo "heartbeat already sent for $today"; exit 0
          fi
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -s -o /dev/null -H "Content-Type: application/json" -X POST \
              -d "{\"content\": \"🏇 競馬BOT 本日の監視を開始しました（$today）\\n買い目が出たレースだけ、この後お知らせします。\"}" \
              "$DISCORD_WEBHOOK_URL" || true
          fi
          echo "$today,$(TZ=Asia/Tokyo date +%H:%M)" >> "$mark"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$mark"
          if ! git diff --cached --quiet; then
            git commit -m "log: monitoring start heartbeat ($today)"
            for t in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 5; done
          fi
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/requirements.txt
      - name: Install dependencies
        run: pip install -r src/requirements.txt
      - name: Predict loop until 05:00 UTC (JST 14:00)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AHEAD_MIN: "8"
          AHEAD_MAX: "30"
          PYTHONIOENCODING: "utf-8"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          end=$(date -u -d "$(date -u +%Y-%m-%d) 05:00" +%s)
          while [ "$(date -u +%s)" -lt "$end" ]; do
            python src/check_and_send.py || true
            if [ -f data/bet_log.csv ]; then git add data/bet_log.csv; fi
            if [ -f data/sent_log.csv ]; then git add data/sent_log.csv; fi
            if ! git diff --cached --quiet; then
              git commit -m "log: predictions sent (day runner am)"
              for t in 1 2 3; do
                git pull --rebase origin main && git push origin main && break
                sleep 10
              done
            fi
            sleep 780
          done
          echo "morning loop done"

  afternoon:
    needs: morning
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/requirements.txt
      - name: Install dependencies
        run: pip install -r src/requirements.txt
      # 予測は18:40 JST(09:40 UTC)まで＝夏の薄暮開催(最終18:30発走)に対応。
      # 精算は keiba.yml の 19:00 JST cron に一本化したので、ここでは行わない。
      - name: Predict until 09:40 UTC (JST 18:40)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          AHEAD_MIN: "8"
          AHEAD_MAX: "30"
          PYTHONIOENCODING: "utf-8"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          end=$(date -u -d "$(date -u +%Y-%m-%d) 09:40" +%s)
          while [ "$(date -u +%s)" -lt "$end" ]; do
            python src/check_and_send.py || true
            if [ -f data/bet_log.csv ]; then git add data/bet_log.csv; fi
            if [ -f data/sent_log.csv ]; then git add data/sent_log.csv; fi
            if ! git diff --cached --quiet; then
              git commit -m "log: predictions sent (day runner pm)"
              for t in 1 2 3; do
                git pull --rebase origin main && git push origin main && break
                sleep 10
              done
            fi
            sleep 780
          done
          echo "day runner finished"
