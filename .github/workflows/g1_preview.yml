name: Keiba G1 Preview

# G1レースの詳細予想を当日昼までにDiscordへ配信する。
# 普段は day_runner の監視ループが自動で出す(src/g1_auto.py)。これは予備の手動起動。
# race_id を指定して手動/外部から起動(workflow_dispatch)。
# 血統ONでpredict.pyを回し、印・期待値・展開の要点を投稿する。

on:
  workflow_dispatch:
    inputs:
      race_id:
        description: "G1のrace_id (例: 202606040911)"
        required: true

concurrency:
  group: keiba-g1preview
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: src/requirements.txt
      - name: Install dependencies
        run: pip install -r src/requirements.txt
      - name: Predict G1, post to Discord and the site
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONIOENCODING: "utf-8"
        run: python src/g1_auto.py --race-id "${{ github.event.inputs.race_id }}" --force
      - name: Commit site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/g1 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "log: G1 preview"
            for t in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 10; done
          fi
